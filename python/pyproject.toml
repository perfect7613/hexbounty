[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexbounty-evidence"
version = "0.1.0"
description = "Deterministic sorted-key JSON and Keccak-256 hashing for HexBounty evidence"
requires-python = ">=3.9"
dependencies = [
  "eth-hash[pycryptodome]==0.7.1",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
hexbounty-evidence = "hexbounty_evidence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
